# Runtime configuration for Genie Lamp Agent
command:
  - uvicorn
  - backend.main:app
  - --host
  - '0.0.0.0'
  - --port
  - '8000'

env:
  # NOTE: DATABRICKS_HOST is automatically provided by Databricks Apps system environment
  # Do not override it - it will be set correctly by the platform

  # NOTE: DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET are automatically provided
  # for the app's service principal. Use WorkspaceClient for OAuth authentication.

  # SQL Warehouse configuration (automatically provided by Databricks Apps)
  - name: WAREHOUSE_ID
    valueFrom: sql_warehouse

  # Frontend static export location (Next.js output: 'export')
  # Path is relative to /app/python/source_code (the working directory)
  - name: FRONTEND_EXPORT_DIR
    value: "frontend/out"

  # Python unbuffered output
  - name: PYTHONUNBUFFERED
    value: "1"
