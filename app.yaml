# Runtime configuration for Genie Lamp Agent
command:
  - uvicorn
  - backend.main:app
  - --host
  - '0.0.0.0'
  - --port
  - '8000'

env:
  # Databricks workspace connection (automatically injected by Databricks Apps)
  - name: DATABRICKS_HOST
    value: "{{workspace.host}}"

  - name: DATABRICKS_SERVER_HOSTNAME
    value: "{{workspace.server_hostname}}"

  # Databricks authentication token (automatically uses workspace token)
  # Note: This uses the workspace's built-in authentication, no secrets needed
  - name: DATABRICKS_TOKEN
    value: "{{workspace.access_token}}"

  # SQL Warehouse HTTP Path (update this with your SQL Warehouse ID)
  # Find this in SQL Warehouse settings under "Connection Details"
  # Format: /sql/1.0/warehouses/<warehouse-id>
  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/your-warehouse-id"

  # Frontend static export location (Next.js output: 'export')
  # Path is relative to /app/python/source_code (the working directory)
  - name: FRONTEND_EXPORT_DIR
    value: "frontend/out"

  # Python unbuffered output
  - name: PYTHONUNBUFFERED
    value: "1"
