# Asset Bundle configuration for Genie Lamp Agent

bundle:
  name: genie-lamp-agent

sync:
  include:
    - frontend/out

  exclude:
    - .claude/

    # Virtual environments
    - ".venv"
    - "venv"
    - "ENV"
    - "env"
    - "backend/.venv"
    - "backend/venv"

    # Node modules and frontend build
    - "frontend/node_modules"
    - "frontend/.next"

    # Local storage and runtime data
    - "storage"
    - "output"

    # Git and development
    - ".git"
    - ".databricks"
    - "worktrees"

    # Python bytecode
    - "__pycache__"
    - "*.pyc"
    - "*.pyo"
    - "*.pyd"

    # Environment and secrets
    - ".env"
    - ".env.local"
    - "backend/.env"
    - "frontend/.env.local"

    # Cache and temporary files
    - "*.log"
    - "*.pid"
    - ".parse_cache.json"
    - "backend/.parse_cache.json"
    - ".last_test_run"

    # IDE and OS
    - ".vscode"
    - ".idea"
    - ".DS_Store"

# Base resources (can be overridden per target)
resources:
  apps:
    genie_lamp_app:
      name: genie-lamp-agent
      description: Genie Lamp Agent - LLM-powered Databricks Genie space configuration generator
      permissions:
        - group_name: databricks-partners
          level: CAN_USE

# Target environments
targets:
  dev:
    mode: development
    default: true
    resources:
      apps:
        genie_lamp_app:
          # Override app name with -dev suffix
          name: genie-lamp-agent-dev
          # Use bundle deployment path
          source_code_path: ${workspace.file_path}/files/
          # User authorization scopes
          user_api_scopes:
            - sql
            - catalog.tables:read
            - catalog.schemas:read
            - catalog.catalogs:read
            - dashboards.genie
          # Grant app access to resources
          resources:
            - name: "databricks-gpt-5-2"
              description: "LLM endpoint for text generation"
              serving_endpoint:
                name: "databricks-gpt-5-2"
                permission: "CAN_QUERY"
            - name: "databricks-claude-sonnet-4"
              description: "Vision model endpoint for PDF parsing"
              serving_endpoint:
                name: "databricks-claude-sonnet-4"
                permission: "CAN_QUERY"
            - name: "validation-warehouse"
              description: "SQL Warehouse for table validation"
              sql_warehouse:
                id: "05e0cdbe4f29bff8"
                permission: "CAN_USE"
          config:
            env:
              # NOTE: DATABRICKS_HOST is automatically provided by system - do not override
              # NOTE: DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET are automatically provided
              # NOTE: WAREHOUSE_ID is automatically provided via sql_warehouse resource (see app.yaml)

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/databricks-agent-poc/genie-lamp-app
    resources:
      apps:
        genie_lamp_app:
          # Keep base name for prod
          name: genie-lamp-agent
          source_code_path: /Workspace/Shared/databricks-agent-poc/genie-lamp-app/files/
          # User authorization scopes
          user_api_scopes:
            - sql
            - catalog.tables:read
            - catalog.schemas:read
            - catalog.catalogs:read
            - dashboards.genie
          # Grant app access to resources
          resources:
            - name: "databricks-gpt-5-2"
              description: "LLM endpoint for text generation"
              serving_endpoint:
                name: "databricks-gpt-5-2"
                permission: "CAN_QUERY"
            - name: "databricks-claude-sonnet-4"
              description: "Vision model endpoint for PDF parsing"
              serving_endpoint:
                name: "databricks-claude-sonnet-4"
                permission: "CAN_QUERY"
            - name: "validation-warehouse"
              description: "SQL Warehouse for table validation"
              sql_warehouse:
                id: "05e0cdbe4f29bff8"
                permission: "CAN_USE"
          config:
            env:
              # NOTE: DATABRICKS_HOST is automatically provided by system - do not override
              # NOTE: DATABRICKS_CLIENT_ID and DATABRICKS_CLIENT_SECRET are automatically provided

              # SQL Warehouse HTTP Path
              - name: DATABRICKS_HTTP_PATH
                value: "{{secrets/genie-lamp/sql-warehouse-http-path-prod}}"
