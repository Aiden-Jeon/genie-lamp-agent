[pytest]
# Pytest configuration for Genie Lamp Agent

# Register custom markers
markers =
    llm: Tests that make real LLM API calls (require RUN_LLM_TESTS=true, incur costs)

# LLM Test Behavior:
# - By default, LLM tests are SKIPPED unless src/llm/ has been modified
# - To force running LLM tests: RUN_LLM_TESTS=true pytest
# - To force skipping LLM tests: SKIP_LLM_TESTS=true pytest
# - Auto-detection uses git diff to check for changes in src/llm/

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = tests

# Ignore paths
norecursedirs = 
    .git
    .venv
    __pycache__
    *.egg-info
    output
